# Testes do backend e checagem de tipos da interface a cada push e pull request.
name: CI

on:
  push:
    branches: [master, android]
    paths-ignore: ['site/**', 'motion_docs/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['site/**', 'motion_docs/**', 'docs/**', '*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      # O Docker é simulado nos testes; o git é real (tests/integration).
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
