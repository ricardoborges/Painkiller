[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "painkiller"
version = "0.1.0"
description = "Automated software development platform via agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "docker>=7.1.0",
    "litellm>=1.40.0",
    "click>=8.1.0",
    "websockets>=12.0",
    # Ambos sao importados em runtime: python-dotenv em api/server.py e httpx
    # no caminho nativo da NVIDIA em adapters/llm/litellm_adapter.py.
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # Exigida pelo upload de anexos (UploadFile/File em api/routes/projects.py).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
# Sem isto o auto-discovery de flat-layout varre web/, web/node_modules/,
# storage/ e docker/ como se fossem pacotes Python.
include = ["painkiller*"]

[project.scripts]
painkiller = "painkiller.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
