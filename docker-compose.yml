# =============================================================================
# Painkiller — plataforma completa
#
#   docker compose --profile build build     # constroi api + worker + agente
#   docker compose up -d                     # sobe so a api, em :8000
#   docker compose logs -f api
#   docker compose down
#
# LEIA ANTES DE DESPACHAR TAREFAS
# -------------------------------
# A api cria os contentores do agente como IRMAOS, pelo socket do host, e nao
# aninhados. Isso significa que o `volumes=` do worker e resolvido pelo daemon
# do HOST: um caminho como /app/storage/... simplesmente nao existe la.
#
# Por isso PAINKILLER_HOST_ROOT precisa apontar para o caminho ABSOLUTO DO HOST
# da pasta ./storage. Defina no .env, por exemplo:
#
#   Windows       PAINKILLER_HOST_ROOT=D:\dev\github\Painkiller\storage
#   Linux/macOS   PAINKILLER_HOST_ROOT=/home/voce/painkiller/storage
#
# Sem essa variavel a interface funciona por inteiro (projetos, analise inicial,
# backlog); apenas o "Despachar" e que monta a pasta errada no agente.
# =============================================================================

name: painkiller

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: painkiller-api:latest
    container_name: painkiller-api
    restart: unless-stopped
    depends_on:
      llm-proxy:
        condition: service_healthy
      gitea:
        condition: service_started

    ports:
      - "8000:8000"

    # Chaves de LLM. Opcional: sem .env a UI sobe, so a analise inicial falha.
    env_file:
      - path: .env
        required: false

    environment:
      # Banco no volume nomeado, fora da camada de escrita do contentor.
      PAINKILLER_DB_URL: sqlite+aiosqlite:////data/painkiller.db

      # Precisam bater com as tags dos servicos *-image abaixo.
      PAINKILLER_WORKER_IMAGE: painkiller-worker:latest
      PAINKILLER_AGENT_IMAGE: painkiller-agent:latest

      # Backend do agente de analise inicial. O Claude Code fala a Messages API
      # da Anthropic (/v1/messages); o NVIDIA Build so expoe o protocolo OpenAI.
      # Por padrao apontamos para o servico llm-proxy, que traduz entre os dois.
      # Para usar a Anthropic direto, deixe ANTHROPIC_BASE_URL vazio no .env e
      # ponha uma chave real em ANTHROPIC_API_KEY.
      # Fixo de proposito: o .env guarda o endereco para rodar no host
      # (host.docker.internal), que nao vale dentro da rede do compose.
      ANTHROPIC_BASE_URL: http://llm-proxy:4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-${PAINKILLER_PROXY_KEY:-sk-painkiller-local}}

      # O Claude Code continua pedindo os aliases embutidos (haiku/sonnet/opus)
      # para tarefas de fundo. Sem remapear, cada uma delas toma 404 no backend
      # proprio -- e a ressalva da documentacao da NVIDIA.
      ANTHROPIC_CUSTOM_MODEL_OPTION: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}
      CLAUDE_CODE_SUBAGENT_MODEL: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}
      PAINKILLER_AGENT_MODEL: ${PAINKILLER_AGENT_MODEL:-painkiller-agent}

      # O contentor do agente nasce IRMAO, pelo socket do host, entao nao entra
      # na rede do compose sozinho e nao resolveria o nome llm-proxy.
      PAINKILLER_AGENT_NETWORK: ${PAINKILLER_AGENT_NETWORK:-painkiller_default}

      # Par de traducao de caminho lido por DockerSandboxRunner._daemon_path.
      # O primeiro e fixo (segue o WORKDIR da imagem); o segundo vem do .env.
      PAINKILLER_CONTAINER_ROOT: /app/storage
      PAINKILLER_HOST_ROOT: ${PAINKILLER_HOST_ROOT:-}

      # Gitea embutido para versionamento e visualizador de codigo
      PAINKILLER_GITEA_INTERNAL_URL: http://gitea:3000
      PAINKILLER_GITEA_EXTERNAL_URL: ${PAINKILLER_GITEA_EXTERNAL_URL:-http://localhost:3000}
      PAINKILLER_GITEA_USER: ${PAINKILLER_GITEA_USER:-painkiller}
      PAINKILLER_GITEA_PASSWORD: ${PAINKILLER_GITEA_PASSWORD:-painkiller_secret_2026}
      PAINKILLER_GITEA_EMAIL: ${PAINKILLER_GITEA_EMAIL:-bot@painkiller.local}

    volumes:
      # Fala com o daemon do host para criar os contentores do agente.
      - /var/run/docker.sock:/var/run/docker.sock

      # Repositorios dos projetos e anexos. Precisa ser bind mount, e nao volume
      # nomeado: os contentores irmaos montam estes mesmos caminhos pelo host.
      - ./storage:/app/storage

      - painkiller-db:/data

  # Traduz /v1/messages (protocolo Anthropic, que o Claude Code fala) para
  # /v1/chat/completions (protocolo OpenAI, o unico que o NVIDIA Build expoe).
  # Desnecessario se voce usa a Anthropic direto ou um NIM auto-hospedado.
  llm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: painkiller-llm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]

    # Publicado porque o caminho "uvicorn no host" alcanca o proxy por
    # host.docker.internal:4000 -- um bind em 127.0.0.1 nao serviria, ja que o
    # host-gateway visto de dentro do contentor do agente nao e o loopback.
    # Dentro do compose o acesso e pelo nome do servico e dispensa isto.
    # Fica protegido pelo master_key (PAINKILLER_PROXY_KEY).
    ports:
      - "4000:4000"

    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      PAINKILLER_PROXY_KEY: ${PAINKILLER_PROXY_KEY:-sk-painkiller-local}
    volumes:
      - ./docker/litellm-proxy.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # Nao sao servicos que rodam: existem so para o compose construir as imagens
  # que a api instancia por nome. Ficam sob profile para que `up` nao os inicie.
  worker-image:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: painkiller-worker:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  # Agente da analise inicial: Claude Code + superpowers, mantido vivo durante a
  # entrevista. Diferente do worker, que e one-shot.
  agent-image:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: painkiller-agent:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  # Gitea embutido — servidor Git self-hosted com visualizador de codigo web
  gitea:
    image: gitea/gitea:1.22
    container_name: painkiller-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=painkiller-secret-key-2026
      - GITEA__server__ROOT_URL=${PAINKILLER_GITEA_EXTERNAL_URL:-http://localhost:3000/}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  painkiller-db:
  gitea-data:

