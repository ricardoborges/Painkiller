# =============================================================================
# Painkiller — plataforma completa
#
#   docker compose --profile build build     # constroi api + worker + agente
#   docker compose up -d                     # sobe so a api, em :8000
#   docker compose logs -f api
#   docker compose down
#
# LEIA ANTES DE DESPACHAR TAREFAS
# -------------------------------
# A api cria os contentores do agente como IRMAOS, pelo socket do host, e nao
# aninhados. Isso significa que o `volumes=` do worker e resolvido pelo daemon
# do HOST: um caminho como /app/storage/... simplesmente nao existe la.
#
# Por isso o caminho ABSOLUTO DO HOST da pasta ./storage precisa ser conhecido.
# A api o descobre sozinha, inspecionando o proprio contentor pelo socket (nao
# defina `hostname:` no servico api). O wizard de setup mostra o valor, testa a
# montagem e aceita outro caminho se a deteccao falhar.
#
# Com o caminho errado a interface funciona por inteiro (projetos, analise
# inicial, backlog); apenas o "Despachar" e que monta a pasta errada no agente.
# =============================================================================

name: painkiller

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: painkiller-api:latest
    container_name: painkiller-api
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_started

    ports:
      - "8000:8000"

    # Opcional e normalmente ausente: tudo e configurado no navegador e fica no
    # banco. Serve so para sobrescrever um ajuste de infraestrutura.
    env_file:
      - path: .env
        required: false

    environment:
      # Banco no volume nomeado, fora da camada de escrita do contentor.
      PAINKILLER_DB_URL: sqlite+aiosqlite:////data/painkiller.db

      # Precisam bater com as tags dos servicos *-image abaixo.
      PAINKILLER_WORKER_IMAGE: painkiller-worker:latest
      PAINKILLER_AGENT_IMAGE: painkiller-agent:latest
      PAINKILLER_WORKER_DEEPSEEK_IMAGE: painkiller-worker-deepseek:latest
      PAINKILLER_AGENT_DEEPSEEK_IMAGE: painkiller-agent-deepseek:latest
      PAINKILLER_WORKER_MAKI_IMAGE: painkiller-worker-maki:latest
      PAINKILLER_AGENT_MAKI_IMAGE: painkiller-agent-maki:latest
      PAINKILLER_WORKER_UNREAL_IMAGE: painkiller-worker-unreal:latest
      PAINKILLER_AGENT_UNREAL_IMAGE: painkiller-agent-unreal:latest


      # O contentor do agente nasce IRMAO, pelo socket do host, entao nao entra
      # na rede do compose sozinho.
      PAINKILLER_AGENT_NETWORK: ${PAINKILLER_AGENT_NETWORK:-painkiller_default}

      # Raiz de ./storage dentro do contentor (segue o WORKDIR da imagem); o
      # lado do host e detectado ou salvo no wizard.
      PAINKILLER_CONTAINER_ROOT: /app/storage

      # Gitea embutido para versionamento e visualizador de codigo
      # Conta de servico, senha e URL externa do Gitea sao geridas pela api
      # (senha gerada e guardada no banco; URL = URL publica + /gitea).
      PAINKILLER_GITEA_INTERNAL_URL: http://gitea:3000

      # Integracao com Coolify on-premise
      COOLIFY_API_URL: ${COOLIFY_API_URL:-http://coolify:8080}
      COOLIFY_GITEA_URL: ${COOLIFY_GITEA_URL:-http://gitea:3000}

    volumes:
      # Fala com o daemon do host para criar os contentores do agente.
      - /var/run/docker.sock:/var/run/docker.sock

      # Repositorios dos projetos e anexos. Precisa ser bind mount, e nao volume
      # nomeado: os contentores irmaos montam estes mesmos caminhos pelo host.
      - ./storage:/app/storage

      # Frontend estático da SPA servido pelo FastAPI
      - ./painkiller/api/static:/app/painkiller/api/static

      # Codigo python em hot-reload
      - ./painkiller:/app/painkiller

      - painkiller-db:/data


  # Nao sao servicos que rodam: existem so para o compose construir as imagens
  # que a api instancia por nome. Ficam sob profile para que `up` nao os inicie.
  worker-image:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: painkiller-worker:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  # Agente da analise inicial: Claude Code + superpowers, mantido vivo durante a
  # entrevista. Diferente do worker, que e one-shot.
  agent-image:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: painkiller-agent:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  worker-deepseek-image:
    build:
      context: .
      dockerfile: docker/deepseek-worker.Dockerfile
    image: painkiller-worker-deepseek:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  agent-deepseek-image:
    build:
      context: .
      dockerfile: docker/deepseek-agent.Dockerfile
    image: painkiller-agent-deepseek:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  worker-maki-image:
    build:
      context: .
      dockerfile: docker/maki-worker.Dockerfile
    image: painkiller-worker-maki:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  agent-maki-image:
    build:
      context: .
      dockerfile: docker/maki-agent.Dockerfile
    image: painkiller-agent-maki:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  worker-unreal-image:
    build:
      context: .
      dockerfile: docker/unreal-worker.Dockerfile
    image: painkiller-worker-unreal:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  agent-unreal-image:
    build:
      context: .
      dockerfile: docker/unreal-agent.Dockerfile
    image: painkiller-agent-unreal:latest
    profiles: ["build"]
    command: ["true"]
    restart: "no"

  # Gitea embutido — servidor Git self-hosted com visualizador de codigo web
  gitea:
    image: gitea/gitea:1.22
    container_name: painkiller-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=painkiller-secret-key-2026
      # ROOT_URL nao fica aqui: o entrypoint regravaria o app.ini a cada start.
      # A api o alinha com a URL publica (environment-to-ini + restart).
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION=true
      - GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION=true
      - GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER=X-WEBAUTH-USER
      - GITEA__security__REVERSE_PROXY_AUTHENTICATION_EMAIL=X-WEBAUTH-EMAIL
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=painkiller-api,127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      # Cada usuario do Painkiller tem uma conta aqui (criada pela api) e so ele
      # ve os proprios repositorios: repo e perfil nascem privados, sem excecao.
      - GITEA__repository__FORCE_PRIVATE=true
      - GITEA__service__DEFAULT_USER_VISIBILITY=private
    ports:
      # So a porta do host muda; dentro da rede do compose continua gitea:3000.
      # 3300 porque a 3000 costuma estar ocupada por servidores de dev (Vite etc.).
      - "${PAINKILLER_GITEA_PORT:-3300}:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    # O Coolify clona e builda em containers auxiliares na rede "coolify";
    # sem estar nela o Gitea nao resolve como gitea:3000 no clone do deploy.
    networks:
      default:
      coolify:
        aliases:
          - gitea
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Coolify On-Premise — Orquestrador de Deploys para Teste e Producao
  coolify:
    image: ghcr.io/coollabsio/coolify:latest
    container_name: painkiller-coolify
    restart: unless-stopped
    depends_on:
      coolify-db:
        condition: service_started
      coolify-redis:
        condition: service_started
      coolify-ssh-init:
        condition: service_completed_successfully
    networks:
      default:
      coolify-ssh:
    ports:
      - "${COOLIFY_PORT:-8008}:8080"
    environment:
      - APP_ENV=production
      - APP_ID=painkiller-coolify
      - APP_KEY=${COOLIFY_APP_KEY:-base64:IaLYJE2m2rTYH5Xu7qdL1ZYPiOloKiWPgnbNx0CetHU=}
      - APP_URL=${COOLIFY_APP_URL:-http://localhost:8008}
      - DB_DATABASE=coolify
      - DB_USERNAME=coolify
      - DB_PASSWORD=coolify_secret_2026
      - DB_HOST=coolify-db
      - DB_PORT=5432
      - REDIS_HOST=coolify-redis
      - REDIS_PORT=6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coolify-data:/data/coolify
      # O seeder do Coolify importa a chave do servidor "localhost" daqui a cada
      # boot. Sem ela, a onboarding quebra com "getPublicKey() on null".
      - coolify-ssh:/var/www/html/storage/app/ssh

  # Gera, uma vez por maquina, a chave SSH do Coolify para o coolify-host. O
  # nome id.root@host.docker.internal e o que o seeder procura; ao importar, o
  # Coolify o renomeia para ssh_key@<uuid>. Por isso a authorized_keys e a
  # fonte de verdade: existindo, nada e gerado (senao um restart trocaria a
  # chave que o banco do Coolify ja guarda). A chave nunca vai para o git.
  coolify-ssh-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - coolify-ssh:/ssh
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /ssh/keys /ssh/mux
        if [ ! -s /ssh/authorized_keys ]; then
          apk add --no-cache openssh-keygen >/dev/null
          key=$$(find /ssh/keys -type f ! -name '*.lock' ! -name '*.pub' | head -n1)
          if [ -z "$$key" ]; then
            key=/ssh/keys/id.root@host.docker.internal
            ssh-keygen -q -t ed25519 -N '' -C coolify@painkiller -f "$$key"
            rm -f "$$key.pub"
          fi
          ssh-keygen -y -f "$$key" > /ssh/authorized_keys
        fi
        chown -R 9999:9999 /ssh
        chmod 700 /ssh /ssh/keys /ssh/mux
        find /ssh/keys -type f ! -name '*.lock' -exec chmod 600 {} +
        chmod 644 /ssh/authorized_keys

  coolify-db:
    image: postgres:16-alpine
    container_name: painkiller-coolify-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=coolify
      - POSTGRES_USER=coolify
      - POSTGRES_PASSWORD=coolify_secret_2026
    volumes:
      - coolify-db-data:/var/lib/postgresql/data

  coolify-redis:
    image: redis:alpine
    container_name: painkiller-coolify-redis
    restart: unless-stopped
    volumes:
      - coolify-redis-data:/data

  # SSH Bridge para o Coolify interagir com o daemon Docker do host
  coolify-host:
    build:
      context: .
      dockerfile: docker/coolify-host.Dockerfile
    container_name: painkiller-coolify-host
    restart: unless-stopped
    depends_on:
      coolify-ssh-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coolify-ssh:/coolify-ssh:ro
    command:
      - sh
      - -c
      - install -m 600 /coolify-ssh/authorized_keys /root/.ssh/authorized_keys && exec /usr/sbin/sshd -D -e
    networks:
      default:
      # O Coolify cria o servidor "localhost" em host.docker.internal:22, que no
      # Docker Desktop e o Windows (sem SSH). Nesta rede, so vista pelo Coolify,
      # o nome resolve para esta ponte.
      coolify-ssh:
        aliases:
          - host.docker.internal

networks:
  coolify-ssh:
  # A rede "coolify" pertence ao Coolify: ele a cria (sem labels do compose)
  # sempre que ela falta. Declara-la como gerenciada pelo compose gera o erro
  # "has incorrect label com.docker.compose.network". Externa, o compose so a
  # usa; crie-a uma vez com: docker network create coolify
  coolify:
    name: coolify
    external: true


volumes:
  painkiller-db:
  gitea-data:
  coolify-data:
  coolify-ssh:
  coolify-db-data:
  coolify-redis-data:

